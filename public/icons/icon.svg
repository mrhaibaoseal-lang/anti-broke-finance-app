<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="50%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0A84FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#30D158" stop-opacity="0.6" />
    </linearGradient>

    <!-- Left Shield Facet (Light) -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Right Shield Facet (Shadow & Depth) -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Shield Plate Inset Gradient -->
    <linearGradient id="plateGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#151E2E" />
      <stop offset="100%" stop-color="#0D131F" />
    </linearGradient>

    <!-- Golden Emerald Spark Core -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Base Background (Full Bleed for iOS / Android maskable) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 2. Ambient Radial Background Backlight -->
  <circle cx="256" cy="240" r="170" fill="#0A84FF" opacity="0.18" filter="url(#shieldGlow)" />
  <circle cx="256" cy="270" r="130" fill="#10B981" opacity="0.15" filter="url(#shieldGlow)" />

  <!-- 3. Squircle Inner Highlight Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#rimGrad)" stroke-width="3" opacity="0.45" />

  <!-- 4. Shield Ambient Shadow -->
  <path d="M 256,76 L 396,136 C 396,256 340,360 256,420 C 172,360 116,256 116,136 Z"
        fill="#000000" opacity="0.5" filter="url(#shieldGlow)" />

  <!-- 5. Shield Outer Rim / Bevel -->
  <path d="M 256,80 L 392,138 C 392,254 338,354 256,414 C 174,354 120,254 120,138 Z"
        fill="url(#rimGrad)" />

  <!-- 6. Shield Dark Inner Plate -->
  <path d="M 256,92 L 380,146 C 380,248 330,340 256,398 C 182,340 132,248 132,146 Z"
        fill="url(#plateGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- 7. Left Facet (Light Cyan-Blue) -->
  <path d="M 256,98 L 138,150 C 138,244 184,332 256,388 Z"
        fill="url(#leftFacet)" opacity="0.9" />

  <!-- 8. Right Facet (Deep Sapphire-Obsidian) -->
  <path d="M 256,98 L 374,150 C 374,244 328,332 256,388 Z"
        fill="url(#rightFacet)" opacity="0.9" />

  <!-- 9. Shield Center Crease Line -->
  <line x1="256" y1="98" x2="256" y2="388" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />

  <!-- 10. Inner Guard Vault Core: Golden-Emerald Emblem -->
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="242" r="66" fill="#064E3B" opacity="0.4" stroke="#34D399" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Core Coin / Medallion -->
  <circle cx="256" cy="242" r="54" fill="url(#coinGrad)" stroke="#6EE7B7" stroke-width="2" filter="url(#coreGlow)" />

  <!-- Inner Golden Spark / Aegis Diamond Star -->
  <path d="M 256,206 Q 256,242 292,242 Q 256,242 256,278 Q 256,242 220,242 Q 256,242 256,206 Z"
        fill="url(#goldGrad)" filter="url(#coreGlow)" />

  <!-- Center Pure Diamond Sparkle -->
  <polygon points="256,224 263,242 256,260 249,242" fill="#FFFFFF" />
  <circle cx="256" cy="242" r="3.5" fill="#FFFFFF" />

  <!-- 11. Upward Wealth / Guarding Chevron Arc -->
  <path d="M 204,320 L 256,290 L 308,320" fill="none" stroke="#67E8F9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M 220,336 L 256,315 L 292,336" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- 12. Top Glass Specular Reflection Arc -->
  <path d="M 148,154 C 200,126 312,126 364,154 C 330,200 182,200 148,154 Z"
        fill="url(#specularGrad)" opacity="0.45" />
</svg>